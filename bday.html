<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Happy Birthday!</title>
  <script src="https://cdn.jsdelivr.net/npm/matter-js@0.20.0/build/matter.min.js"></script>
  <style>
    :root {
      color-scheme: dark;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      overflow: hidden;
      background: #10182b;
      font-family: 'Arial Black', Impact, sans-serif;
      user-select: none;
    }

    #sky,
    #world {
      position: fixed;
      inset: 0;
      display: block;
      width: 100%;
      height: 100%;
    }

    #sky {
      z-index: 0;
      pointer-events: none;
    }

    #world {
      z-index: 1;
      touch-action: none;
    }

    .controls {
      position: fixed;
      right: 16px;
      bottom: 16px;
      z-index: 2;
      display: flex;
      gap: 8px;
    }

    .hint {
      position: fixed;
      left: 16px;
      bottom: 20px;
      z-index: 2;
      margin: 0;
      color: rgba(255, 255, 255, 0.8);
      font: 14px Arial, sans-serif;
      pointer-events: none;
    }

    button {
      min-height: 44px;
      padding: 10px 16px;
      border: 2px solid rgba(255, 255, 255, 0.75);
      border-radius: 999px;
      background: rgba(18, 18, 18, 0.88);
      color: #fff;
      font: 700 14px Arial, sans-serif;
      cursor: pointer;
      backdrop-filter: blur(8px);
    }

    button:hover,
    button:focus-visible {
      background: #fff;
      color: #121212;
      outline: none;
    }
  </style>
</head>
<body>
  <canvas id="sky" aria-hidden="true"></canvas>
  <canvas id="world" aria-label="Interactive hanging birthday letters"></canvas>
  <div class="controls" aria-label="Birthday controls">
    <button id="celebrate" type="button">Celebrate!</button>
    <button id="reset" type="button">Reset</button>
  </div>
  <p class="hint">Drag the letters to swing them</p>

<script>
  if (typeof Matter === 'undefined') {
    document.body.innerHTML = '<p style="padding:24px;color:white;font-family:Arial">Unable to load the animation. Check your internet connection and refresh.</p>';
    throw new Error('Matter.js failed to load');
  }

  const { Engine, Render, Runner, Bodies, Composite, Constraint, Mouse, MouseConstraint, Events } = Matter;

  const engine = Engine.create();
  const world = engine.world;

  const render = Render.create({
    element: document.body,
    engine: engine,
    canvas: document.getElementById('world'),
    options: {
      width: window.innerWidth,
      height: window.innerHeight,
      wireframes: false,
      background: 'transparent',
      pixelRatio: Math.min(window.devicePixelRatio || 1, 2)
    }
  });

  Render.run(render);
  const runner = Runner.create();
  Runner.run(runner, engine);

  const wallThickness = 100;
  let walls = [];
  let letterBodies = [];
  let letterStrings = [];
  let confettiBodies = [];
  let boxSize = 75;

  function createWalls() {
    Composite.remove(world, walls);
    const w = window.innerWidth;
    const h = window.innerHeight;
    const options = { isStatic: true, render: { visible: false } };

    walls = [
      Bodies.rectangle(w / 2, h + wallThickness / 2, w * 2, wallThickness, options), // Floor
      Bodies.rectangle(w / 2, -wallThickness / 2, w * 2, wallThickness, options),   // Ceiling
      Bodies.rectangle(-wallThickness / 2, h / 2, wallThickness, h * 2, options),   // Left
      Bodies.rectangle(w + wallThickness / 2, h / 2, wallThickness, h * 2, options) // Right
    ];
    Composite.add(world, walls);
  }
  createWalls();

  const lines = ["HAPPY", "BIRTHDAY"];
  const colors = ['#FF595E', '#FFCA3A', '#8AC926', '#1982C4', '#6A4C93', '#FF924C'];
  const skyCanvas = document.getElementById('sky');
  const skyContext = skyCanvas.getContext('2d');
  const clouds = [];
  const stars = [];
  let skyWidth = window.innerWidth;
  let skyHeight = window.innerHeight;
  let lastFrameTime = 0;
  let flightProgress = 0;
  let lastFlightPoint = null;
  let contrail = [];
  let fireworks = [];

  function resizeSky() {
    const ratio = Math.min(window.devicePixelRatio || 1, 2);
    skyWidth = window.innerWidth;
    skyHeight = window.innerHeight;
    skyCanvas.width = Math.round(skyWidth * ratio);
    skyCanvas.height = Math.round(skyHeight * ratio);
    skyContext.setTransform(ratio, 0, 0, ratio, 0, 0);

    clouds.length = 0;
    for (let i = 0; i < 13; i++) {
      clouds.push({
        x: Math.random() * skyWidth,
        y: skyHeight * (0.08 + Math.random() * 0.68),
        size: 90 + Math.random() * Math.max(100, skyWidth * 0.12),
        drift: 2 + Math.random() * 8,
        depth: 0.35 + Math.random() * 0.65,
        phase: Math.random() * Math.PI * 2
      });
    }

    stars.length = 0;
    for (let i = 0; i < 100; i++) {
      stars.push({ x: Math.random() * skyWidth, y: Math.random() * skyHeight * 0.72, r: 0.4 + Math.random() * 1.2 });
    }
  }

  function mixColor(day, night, amount) {
    const a = day.match(/\w\w/g).map(value => parseInt(value, 16));
    const b = night.match(/\w\w/g).map(value => parseInt(value, 16));
    return `rgb(${a.map((value, index) => Math.round(value + (b[index] - value) * amount)).join(',')})`;
  }

  function drawSky(time, delta) {
    const phase = (time / 150000) * Math.PI * 2;
    const night = (1 - Math.cos(phase)) / 2;
    const gradient = skyContext.createLinearGradient(0, 0, 0, skyHeight);
    gradient.addColorStop(0, mixColor('#4386bd', '#070d22', night));
    gradient.addColorStop(0.58, mixColor('#f6b780', '#172344', night));
    gradient.addColorStop(1, mixColor('#dce5ed', '#293453', night));
    skyContext.fillStyle = gradient;
    skyContext.fillRect(0, 0, skyWidth, skyHeight);

    skyContext.fillStyle = `rgba(255,255,255,${night * 0.8})`;
    stars.forEach(star => {
      skyContext.globalAlpha = night * (0.4 + 0.6 * Math.sin(time / 900 + star.x));
      skyContext.beginPath();
      skyContext.arc(star.x, star.y, star.r, 0, Math.PI * 2);
      skyContext.fill();
    });
    skyContext.globalAlpha = 1;

    clouds.forEach(cloud => {
      cloud.x += cloud.drift * delta / 1000;
      if (cloud.x - cloud.size > skyWidth) cloud.x = -cloud.size;
      const y = cloud.y + Math.sin(time / 9000 + cloud.phase) * 5;
      const radius = cloud.size;
      const puff = skyContext.createRadialGradient(cloud.x, y, radius * 0.08, cloud.x, y, radius);
      puff.addColorStop(0, `rgba(255,255,255,${0.27 * cloud.depth})`);
      puff.addColorStop(0.35, `rgba(255,255,255,${0.17 * cloud.depth})`);
      puff.addColorStop(1, 'rgba(255,255,255,0)');
      skyContext.fillStyle = puff;
      skyContext.beginPath();
      skyContext.ellipse(cloud.x, y, radius * 1.8, radius * 0.52, 0, 0, Math.PI * 2);
      skyContext.fill();

      const shadow = skyContext.createLinearGradient(0, y, 0, y + radius * 0.7);
      shadow.addColorStop(0, `rgba(255,255,255,${0.08 * cloud.depth})`);
      shadow.addColorStop(1, `rgba(27,39,66,${(0.12 + night * 0.1) * cloud.depth})`);
      skyContext.fillStyle = shadow;
      skyContext.beginPath();
      skyContext.ellipse(cloud.x, y + radius * 0.08, radius * 1.2, radius * 0.2, 0, 0, Math.PI * 2);
      skyContext.fill();
    });
  }

  function flightPosition(progress) {
    const x = -100 + progress * (skyWidth + 200);
    const cycles = 5;
    const amplitude = Math.min(skyHeight * 0.08, 64);
    const centerY = skyHeight * 0.48;
    const angle = progress * cycles * Math.PI * 2;
    const heading = Math.atan2(
      amplitude * cycles * Math.PI * 2 * Math.sin(angle),
      skyWidth + 200
    );
    return {
      x,
      y: centerY - Math.cos(angle) * amplitude,
      rotation: Math.max(-0.2, Math.min(0.2, heading))
    };
  }

  function drawJet(ctx, x, y, rotation, scale) {
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(rotation);
    ctx.scale(scale, scale);

    const flame = ctx.createRadialGradient(-34, 0, 1, -34, 0, 26);
    flame.addColorStop(0, 'rgba(255,255,235,0.95)');
    flame.addColorStop(0.2, 'rgba(90,190,255,0.9)');
    flame.addColorStop(0.55, 'rgba(40,115,255,0.35)');
    flame.addColorStop(1, 'rgba(20,80,255,0)');
    ctx.fillStyle = flame;
    ctx.beginPath();
    ctx.ellipse(-35, 0, 33, 13, 0, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = '#10151c';
    ctx.strokeStyle = 'rgba(190,205,220,0.8)';
    ctx.lineWidth = 0.8;
    ctx.beginPath();
    ctx.moveTo(51, 0);
    ctx.lineTo(31, -4);
    ctx.lineTo(7, -7);
    ctx.lineTo(-8, -24);
    ctx.lineTo(-21, -25);
    ctx.lineTo(-18, -8);
    ctx.lineTo(-48, -12);
    ctx.lineTo(-63, -8);
    ctx.lineTo(-42, 0);
    ctx.lineTo(-63, 8);
    ctx.lineTo(-48, 12);
    ctx.lineTo(-18, 8);
    ctx.lineTo(-21, 25);
    ctx.lineTo(-8, 24);
    ctx.lineTo(7, 7);
    ctx.lineTo(31, 4);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();

    ctx.fillStyle = '#26323c';
    ctx.beginPath();
    ctx.moveTo(16, 0);
    ctx.lineTo(0, -2.4);
    ctx.lineTo(-19, -5);
    ctx.lineTo(-29, 0);
    ctx.lineTo(-19, 5);
    ctx.lineTo(0, 2.4);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = 'rgba(120,195,225,0.8)';
    ctx.beginPath();
    ctx.ellipse(11, 0, 8, 1.5, 0, 0, Math.PI * 2);
    ctx.fill();

    ctx.restore();
  }

  function trimContrail(maxLength) {
    let length = 0;
    for (let i = contrail.length - 1; i > 0; i--) {
      const newer = contrail[i];
      const older = contrail[i - 1];
      const segmentLength = Math.hypot(newer.x - older.x, newer.y - older.y);
      if (length + segmentLength > maxLength) {
        const ratio = (maxLength - length) / segmentLength;
        const start = {
          x: newer.x + (older.x - newer.x) * ratio,
          y: newer.y + (older.y - newer.y) * ratio,
          rotation: newer.rotation + (older.rotation - newer.rotation) * ratio,
          time: newer.time + (older.time - newer.time) * ratio
        };
        contrail.splice(0, i, start);
        return;
      }
      length += segmentLength;
    }
  }

  function launchFireworks() {
    const palette = ['#ff595e', '#ffca3a', '#8ac926', '#74d7ff', '#ffd6f5'];
    const now = performance.now();
    for (let burst = 0; burst < 3; burst++) {
      const originX = skyWidth * (0.18 + Math.random() * 0.64);
      const originY = skyHeight * (0.16 + Math.random() * 0.38);
      const color = palette[Math.floor(Math.random() * palette.length)];
      const count = 32;
      for (let i = 0; i < count; i++) {
        const angle = (i / count) * Math.PI * 2 + Math.random() * 0.08;
        const speed = 55 + Math.random() * 105;
        fireworks.push({
          x: originX,
          y: originY,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed,
          color,
          size: 1.5 + Math.random() * 1.5,
          born: now,
          life: 900 + Math.random() * 500
        });
      }
    }
  }

  function drawFireworks(ctx, time) {
    fireworks = fireworks.filter(spark => time - spark.born < spark.life);
    ctx.save();
    fireworks.forEach(spark => {
      const age = (time - spark.born) / 1000;
      const x = spark.x + spark.vx * age;
      const y = spark.y + spark.vy * age + 45 * age * age;
      const tailAge = Math.min(age, 0.12);
      ctx.globalAlpha = Math.max(0, 1 - age * 1000 / spark.life);
      ctx.strokeStyle = spark.color;
      ctx.lineWidth = spark.size;
      ctx.beginPath();
      ctx.moveTo(x - spark.vx * tailAge, y - spark.vy * tailAge);
      ctx.lineTo(x, y);
      ctx.stroke();
    });
    ctx.restore();
  }

  function animateScene(time) {
    const delta = lastFrameTime ? Math.min(time - lastFrameTime, 50) : 16;
    lastFrameTime = time;
    drawSky(time, delta);

    flightProgress += delta / 15000;
    if (flightProgress >= 1) {
      flightProgress = 0;
      contrail = [];
      lastFlightPoint = null;
    }
    const jet = flightPosition(flightProgress);
    const trailPoint = { x: jet.x, y: jet.y, rotation: jet.rotation, time };
    if (!lastFlightPoint || Math.hypot(jet.x - lastFlightPoint.x, jet.y - lastFlightPoint.y) > 3) {
      contrail.push(trailPoint);
      lastFlightPoint = trailPoint;
    }
    trimContrail(50);

    const ctx = skyContext;
    ctx.save();
    ctx.lineCap = 'round';
    for (let i = 1; i < contrail.length; i++) {
      const previous = contrail[i - 1];
      const point = contrail[i];
      const age = time - point.time;
      const opacity = 0.34 * Math.exp(-age / 1200);
      ctx.strokeStyle = `rgba(225,242,255,${opacity})`;
      ctx.lineWidth = 2 + 2 * Math.min(age / 500, 1);
      ctx.beginPath();
      ctx.moveTo(previous.x - Math.cos(previous.rotation) * 38, previous.y - Math.sin(previous.rotation) * 38);
      ctx.lineTo(point.x - Math.cos(point.rotation) * 38, point.y - Math.sin(point.rotation) * 38);
      ctx.stroke();
    }
    drawJet(ctx, jet.x, jet.y, jet.rotation, 0.72);
    ctx.restore();
    drawFireworks(ctx, time);
    requestAnimationFrame(animateScene);
  }
  resizeSky();
  requestAnimationFrame(animateScene);

  function createLetters() {
    Composite.remove(world, letterBodies);
    Composite.remove(world, letterStrings);
    letterBodies = [];
    letterStrings = [];

    const longestWord = Math.max(...lines.map(word => word.length));
    boxSize = Math.max(34, Math.min(window.innerWidth / (longestWord + 2), window.innerHeight / 9, 75));

    lines.forEach((word, lineIndex) => {
      const totalWidth = word.length * (boxSize + 8);
      const startX = (window.innerWidth - totalWidth) / 2 + boxSize / 2;
      const startY = window.innerHeight * 0.25 + lineIndex * (boxSize + 20);

      for (let i = 0; i < word.length; i++) {
        const char = word[i];
        const color = colors[(i + lineIndex * 3) % colors.length];

        const body = Bodies.rectangle(
          startX + i * (boxSize + 8),
          startY,
          boxSize,
          boxSize,
          {
            restitution: 0.8,
            friction: 0.1,
            chamfer: { radius: Math.min(12, boxSize * 0.16) },
            render: { fillStyle: color }
          }
        );

        body.char = char;
        letterBodies.push(body);

        const anchor = { x: body.position.x, y: 22 };
        letterStrings.push(Constraint.create({
          pointA: anchor,
          bodyB: body,
          pointB: { x: 0, y: -boxSize / 2 },
          length: Math.max(10, startY - boxSize / 2 - anchor.y),
          stiffness: 0.95,
          damping: 0.08,
          render: { visible: false }
        }));
      }
    });

    Composite.add(world, letterBodies);
    Composite.add(world, letterStrings);
  }
  createLetters();

  Events.on(render, 'afterRender', () => {
    const ctx = render.context;
    ctx.save();
    ctx.strokeStyle = 'rgba(255, 255, 255, 0.72)';
    ctx.lineWidth = 2;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(0, 22);
    ctx.lineTo(window.innerWidth, 22);
    ctx.stroke();

    letterStrings.forEach((string, index) => {
      const body = letterBodies[index];
      const attachment = Matter.Vector.add(
        body.position,
        Matter.Vector.rotate({ x: 0, y: -boxSize / 2 }, body.angle)
      );
      ctx.beginPath();
      ctx.moveTo(string.pointA.x, string.pointA.y);
      ctx.lineTo(attachment.x, attachment.y);
      ctx.stroke();

      ctx.beginPath();
      ctx.arc(string.pointA.x, string.pointA.y, 3, 0, Math.PI * 2);
      ctx.fillStyle = '#fff';
      ctx.fill();
    });
    ctx.restore();

    ctx.font = `bold ${boxSize * 0.6}px 'Arial Black', Impact, sans-serif`;
    ctx.fillStyle = '#121212';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';

    letterBodies.forEach((body) => {
      ctx.save();
      ctx.translate(body.position.x, body.position.y);
      ctx.rotate(body.angle);
      ctx.fillText(body.char, 0, 2);
      ctx.restore();
    });
  });

  const mouse = Mouse.create(render.canvas);
  const mouseConstraint = MouseConstraint.create(engine, {
    mouse: mouse,
    constraint: {
      stiffness: 0.2,
      render: { visible: false }
    }
  });
  Composite.add(world, mouseConstraint);
  render.mouse = mouse;

  Events.on(engine, 'afterUpdate', () => {
    const now = performance.now();
    const expired = confettiBodies.filter(body => now - body.createdAt > 8000);
    if (expired.length) {
      Composite.remove(world, expired);
      confettiBodies = confettiBodies.filter(body => !expired.includes(body));
    }
  });

  function celebrate() {
    const newConfetti = [];
    for (let i = 0; i < 80; i++) {
      const size = 5 + Math.random() * 8;
      const confetti = Bodies.rectangle(
        window.innerWidth / 2 + (Math.random() - 0.5) * 180,
        window.innerHeight * 0.18,
        size,
        size * 0.55,
        {
          restitution: 0.7,
          frictionAir: 0.02,
          render: { fillStyle: colors[i % colors.length] }
        }
      );

      confetti.createdAt = performance.now();
      Matter.Body.setVelocity(confetti, {
        x: (Math.random() - 0.5) * 14,
        y: -8 - Math.random() * 10
      });
      confettiBodies.push(confetti);
      newConfetti.push(confetti);
    }
    Composite.add(world, newConfetti);
    launchFireworks();
  }

  document.getElementById('celebrate').addEventListener('click', celebrate);
  document.getElementById('reset').addEventListener('click', () => {
    Composite.remove(world, confettiBodies);
    confettiBodies = [];
    createLetters();
  });

  window.addEventListener('resize', () => {
    Render.setSize(render, window.innerWidth, window.innerHeight);
    resizeSky();
    createWalls();
    createLetters();
  });
</script>

</body>
</html>
