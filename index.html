<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ritanglu Sites</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; }
    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      background: #10182b;
      color: #fff;
    }
    main {
      width: min(680px, calc(100% - 40px));
      text-align: center;
    }
    nav {
      display: grid;
      gap: 16px;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      margin-top: 24px;
    }
    a {
      padding: 24px 16px;
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 16px;
      color: inherit;
      background: rgba(255, 255, 255, 0.08);
      text-decoration: none;
      font-size: 18px;
      font-weight: 700;
    }
    a:hover, a:focus-visible {
      background: #fff;
      color: #10182b;
    }
  </style>
</head>
<body>
  <main>
    <h1>Ritanglu Sites</h1>
    <nav>
      <a href="./bday.html">Birthday Page</a>
      <a href="./cricket_tactics_web/">Cricket Tactics</a>
    </nav>
  </main>
</body>
</html>
